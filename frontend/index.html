<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Procurement AI Assistant</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    background: linear-gradient(135deg,#eef2f7,#dfe9f3);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.chat-container{
    width:900px;
    max-width:95%;
    height:92vh;
    background:#ffffff;
    border-radius:18px;
    box-shadow:0 15px 40px rgba(0,0,0,0.12);
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.header{
    background:linear-gradient(90deg,#1d4ed8,#2563eb);
    color:white;
    padding:22px;
    text-align:center;
}

.header h1{
    font-size:34px;
    margin-bottom:6px;
}

.header p{
    opacity:0.9;
    font-size:14px;
}

.quick-buttons{
    padding:12px;
    border-bottom:1px solid #eee;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    background:#fafafa;
}

.quick-buttons button{
    border:none;
    background:#e8f0ff;
    color:#1d4ed8;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    font-size:13px;
    transition:0.2s;
}

.quick-buttons button:hover{
    background:#d6e5ff;
}

.chat-box{
    flex:1;
    overflow-y:auto;
    padding:18px;
    background:#f8fafc;
}

.message{
    margin-bottom:18px;
    display:flex;
    flex-direction:column;
}

.user{
    align-items:flex-end;
}

.bot{
    align-items:flex-start;
}

.bubble{
    max-width:75%;
    padding:14px 16px;
    border-radius:16px;
    line-height:1.5;
    white-space:pre-wrap;
    word-wrap:break-word;
}

.user .bubble{
    background:#2563eb;
    color:white;
    border-bottom-right-radius:5px;
}

.bot .bubble{
    background:#eaf4e7;
    color:#111827;
    border-bottom-left-radius:5px;
}

.raw{
    margin-top:8px;
    font-size:12px;
    color:#555;
}

.raw summary{
    cursor:pointer;
    margin-bottom:5px;
}

.raw pre{
    background:#f1f5f9;
    padding:10px;
    border-radius:10px;
    overflow:auto;
}

.typing{
    display:inline-block;
}

.typing span{
    height:8px;
    width:8px;
    margin:0 2px;
    background:#666;
    border-radius:50%;
    display:inline-block;
    animation:bounce 1.2s infinite;
}

.typing span:nth-child(2){
    animation-delay:0.2s;
}

.typing span:nth-child(3){
    animation-delay:0.4s;
}

@keyframes bounce{
    0%,80%,100%{transform:translateY(0);}
    40%{transform:translateY(-8px);}
}

.input-area{
    display:flex;
    padding:16px;
    gap:12px;
    border-top:1px solid #eee;
    background:white;
}

input{
    flex:1;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:12px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#2563eb;
}

button.send{
    background:#2563eb;
    color:white;
    border:none;
    padding:0 24px;
    border-radius:12px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

button.send:hover{
    background:#1d4ed8;
}

.footer{
    text-align:center;
    font-size:12px;
    padding:8px;
    color:#666;
    background:#fafafa;
}

@media(max-width:700px){
    .header h1{font-size:24px;}
    .bubble{max-width:90%;}
}
</style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <h1>Procurement AI Assistant</h1>
        <p>Ask procurement spending, suppliers, departments & purchase insights</p>
    </div>

    <div class="quick-buttons">
        <button onclick="quickAsk('What is total spending?')">Total Spending</button>
        <button onclick="quickAsk('Which supplier has the highest spending?')">Top Supplier</button>
        <button onclick="quickAsk('Which department spent the most money?')">Top Department</button>
        <button onclick="quickAsk('Show top 5 suppliers by spending')">Top 5 Suppliers</button>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">
        <input
            type="text"
            id="question"
            placeholder="Ask procurement question..."
            onkeydown="if(event.key==='Enter')sendMessage()"
        />
        <button class="send" onclick="sendMessage()">Send</button>
    </div>

    <div class="footer">
        Powered by FastAPI + MongoDB + Ollama
    </div>

</div>

<script>
const API_URL = "http://127.0.0.1:8000/chat";

function addMessage(type,text,raw=null){
    const chatBox = document.getElementById("chatBox");

    const msg = document.createElement("div");
    msg.className = "message " + type;

    let html = `<div class="bubble">${text}</div>`;

    if(raw){
        html += `
        <div class="raw">
            <details>
                <summary>View Raw Result</summary>
                <pre>${JSON.stringify(raw,null,2)}</pre>
            </details>
        </div>`;
    }

    msg.innerHTML = html;
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function showTyping(){
    const chatBox = document.getElementById("chatBox");

    const msg = document.createElement("div");
    msg.className = "message bot";
    msg.id = "typingBox";

    msg.innerHTML = `
        <div class="bubble">
            <div class="typing">
                <span></span><span></span><span></span>
            </div>
        </div>
    `;

    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function removeTyping(){
    const el = document.getElementById("typingBox");
    if(el) el.remove();
}

async function sendMessage(){
    const input = document.getElementById("question");
    const question = input.value.trim();

    if(!question) return;

    addMessage("user",question);
    input.value = "";
    showTyping();

    try{
        const response = await fetch(API_URL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body: JSON.stringify({
                question: question
            })
        });

        const data = await response.json();
        removeTyping();

        addMessage("bot", data.answer || "No response", data.result);

    }catch(error){
        removeTyping();
        addMessage("bot","Server connection failed.");
    }
}

function quickAsk(text){
    document.getElementById("question").value = text;
    sendMessage();
}
</script>

</body>
</html>
